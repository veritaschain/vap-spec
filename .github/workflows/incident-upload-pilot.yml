name: Controlled incident upload pilot

on:
  push:
    paths:
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-upload-pilot.yml'
  pull_request:
    paths:
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-upload-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      PILOT_NETWORK_TESTS: '1'
    defaults:
      run:
        working-directory: experiments/incident-upload-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Unit and actual HTTP regression tests; zero skips required
        run: python -W error::ResourceWarning run_tests.py --require-network
      - name: Execute all 17 measured loopback scenarios
        run: python -m upload_pilot run-suite --output generated --print-summary
      - name: Recheck exported evidence without repeating network actions
        run: python -m upload_pilot verify-exports generated
      - name: Preserve unchanged assessor behavior
        working-directory: experiments/incident-evidence-assessor
        run: |
          python -m unittest discover -s tests -v
          python -m incident_assessor run-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: incident-upload-python-${{ matrix.python }}
          path: experiments/incident-upload-pilot/generated/
          if-no-files-found: error
          retention-days: 30

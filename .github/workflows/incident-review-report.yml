name: Incident evidence review report

on:
  push:
    paths:
      - 'experiments/incident-review-report/**'
      - 'experiments/incident-recheck-kit/**'
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-publication-pilot/**'
      - 'experiments/incident-erasure-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-review-report.yml'
  pull_request:
    paths:
      - 'experiments/incident-review-report/**'
      - 'experiments/incident-recheck-kit/**'
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-publication-pilot/**'
      - 'experiments/incident-erasure-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-review-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-attributed-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/incident-review-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare pinned dependencies explicitly
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Strict tests and deterministic report rederivation
        run: python -W error::ResourceWarning record_run.py --output generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: incident-review-python-${{ matrix.python-version }}
          path: |
            experiments/incident-review-report/generated/incident-review.zip
            experiments/incident-review-report/generated/review.json
            experiments/incident-review-report/generated/review-en.md
            experiments/incident-review-report/generated/review-ja.md
            experiments/incident-review-report/generated/manifest.json
            experiments/incident-review-report/generated/summary.json
            experiments/incident-review-report/generated/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

name: Cloud credential collector pilot

on:
  push:
    paths:
      - 'experiments/cloud-credential-collector/**'
      - 'experiments/cloud-credential-evidence/**'
      - 'proposals/cloud-credential-evidence/**'
      - '.github/workflows/cloud-credential-collector.yml'
  pull_request:
    paths:
      - 'experiments/cloud-credential-collector/**'
      - 'experiments/cloud-credential-evidence/**'
      - 'proposals/cloud-credential-evidence/**'
      - '.github/workflows/cloud-credential-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/cloud-credential-collector/requirements.txt
      - name: Check local custody and portable verification
        run: python -W error::ResourceWarning -m unittest discover -s experiments/cloud-credential-collector/tests -v
      - name: Check optimized Python behavior
        run: python -O -W error::ResourceWarning -m unittest discover -s experiments/cloud-credential-collector/tests -v
      - name: Run synthetic collection demo
        run: python -W error::ResourceWarning experiments/cloud-credential-collector/run_demo.py
      - name: Run portable custody snapshot demo
        run: python -W error::ResourceWarning experiments/cloud-credential-collector/run_pack_demo.py

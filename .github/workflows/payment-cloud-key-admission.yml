name: Payment and cloud configured-key admission

on:
  push:
    paths:
      - 'experiments/ed25519-key-admission/**'
      - 'experiments/payment-api-evidence/**'
      - 'experiments/wallet-authorization-evidence/**'
      - 'experiments/payment-runtime-pilot/**'
      - 'experiments/payment-authorization-pilot/**'
      - 'experiments/payment-collector-pilot/**'
      - 'experiments/cloud-credential-evidence/**'
      - 'experiments/cloud-credential-collector/**'
      - '.github/workflows/payment-cloud-key-admission.yml'
  pull_request:
    paths:
      - 'experiments/ed25519-key-admission/**'
      - 'experiments/payment-api-evidence/**'
      - 'experiments/wallet-authorization-evidence/**'
      - 'experiments/payment-runtime-pilot/**'
      - 'experiments/payment-authorization-pilot/**'
      - 'experiments/payment-collector-pilot/**'
      - 'experiments/cloud-credential-evidence/**'
      - 'experiments/cloud-credential-collector/**'
      - '.github/workflows/payment-cloud-key-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r experiments/cloud-credential-evidence/requirements.txt
      - name: Check all current configured-key entry points
        run: python -W error::ResourceWarning -m unittest discover -s experiments/ed25519-key-admission/tests -v
      - name: Check admission with assertions disabled
        run: python -O -W error::ResourceWarning -m unittest discover -s experiments/ed25519-key-admission/tests -v

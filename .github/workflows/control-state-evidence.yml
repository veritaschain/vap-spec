name: Experimental control-state evidence
on:
  pull_request:
    paths:
      - 'experiments/control-state-evidence/**'
      - 'experiments/os-isolated-gate/**'
      - 'experiments/pre-record-gate/**'
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/control-state-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/os-isolated-gate/requirements.txt
      - name: Synthetic evidence and preflight regressions, not OS results
        run: |
          python -m unittest discover -s experiments/control-state-evidence/tests -v
          python -O -m unittest discover -s experiments/control-state-evidence/tests -v
      - name: Capture an actual fresh Linux lab run
        run: |
          python experiments/control-state-evidence/run.py run --output experiments/control-state-evidence/generated/current
          python experiments/control-state-evidence/run.py verify experiments/control-state-evidence/generated/current/bundle.json --trusted-key experiments/control-state-evidence/generated/current/test-public-key.hex --run-id "$(cat experiments/control-state-evidence/generated/current/run-id.txt)"
          cd experiments/os-isolated-gate
          python -m isolation_lab verify-evidence ../control-state-evidence/generated/current/legacy/evidence.json
      - name: Unchanged upstream regressions and acceptance suites
        run: |
          (cd experiments/os-isolated-gate && python -W error::ResourceWarning -m unittest discover -s tests -v)
          (cd experiments/pre-record-gate && python -W error::ResourceWarning -m unittest discover -s tests -v && python -m record_gate run-suite && python -m record_gate verify-exports)
          (cd experiments/declared-scope-verifier && python -m unittest discover -s tests -v && python -m scope_verifier run-suite)
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: control-state-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/control-state-evidence/generated/
          if-no-files-found: error
          retention-days: 30

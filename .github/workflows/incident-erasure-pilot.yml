name: Local incident erasure pilot

on:
  push:
    paths:
      - 'experiments/incident-erasure-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-erasure-pilot.yml'
  pull_request:
    paths:
      - 'experiments/incident-erasure-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-erasure-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-erasure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/incident-erasure-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Actual filesystem and evidence tests; zero skips required
        run: python -W error::ResourceWarning run_tests.py --require-no-skips
      - name: Execute all 18 measured local erasure scenarios
        run: python -m erasure_pilot run-suite --output generated --print-summary
      - name: Recheck captured evidence without repeating erasure
        run: python -m erasure_pilot verify-exports generated
      - name: Preserve unchanged assessor behavior
        working-directory: experiments/incident-evidence-assessor
        run: |
          python -m unittest discover -s tests -v
          python -m incident_assessor run-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incident-erasure-python-${{ matrix.python-version }}
          path: |
            experiments/incident-erasure-pilot/generated/summary.json
            experiments/incident-erasure-pilot/generated/cases/
          if-no-files-found: error
          retention-days: 30

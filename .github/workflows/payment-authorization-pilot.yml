name: Payment authorization pilot

on:
  push:
    paths:
      - 'experiments/payment-authorization-pilot/**'
      - 'experiments/payment-runtime-pilot/**'
      - '.github/workflows/payment-authorization-pilot.yml'
  pull_request:
    paths:
      - 'experiments/payment-authorization-pilot/**'
      - 'experiments/payment-runtime-pilot/**'
      - '.github/workflows/payment-authorization-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorized-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/payment-authorization-pilot/requirements.txt
      - name: Authorization, atomic claim and actual dispatch tests
        run: python -W error::ResourceWarning -m unittest discover -s experiments/payment-authorization-pilot/tests -v
      - name: Recheck unchanged runtime behaviors
        run: python -W error::ResourceWarning -m unittest discover -s experiments/payment-runtime-pilot/tests -v
      - name: Signed approval and lost acknowledgment demo
        run: python experiments/payment-authorization-pilot/run_demo.py --output experiments/payment-authorization-pilot/generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-authorization-public-demo
          path: |
            experiments/payment-authorization-pilot/generated/summary.json
            experiments/payment-authorization-pilot/generated/admission-record.json
            experiments/payment-authorization-pilot/generated/provider-receipt.json
          if-no-files-found: error
          retention-days: 30

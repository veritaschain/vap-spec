name: Cloud credential evidence experiment

on:
  push:
    paths:
      - 'experiments/cloud-credential-evidence/**'
      - 'proposals/cloud-credential-evidence/**'
      - '.github/workflows/cloud-credential-evidence.yml'
  pull_request:
    paths:
      - 'experiments/cloud-credential-evidence/**'
      - 'proposals/cloud-credential-evidence/**'
      - '.github/workflows/cloud-credential-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/cloud-credential-evidence/requirements.txt
      - name: Check evidence distinctions
        run: python -m unittest discover -s experiments/cloud-credential-evidence/tests -v
      - name: Check optimized Python behavior
        run: python -O -m unittest discover -s experiments/cloud-credential-evidence/tests -v
      - name: Show synthetic acceptance matrix
        run: python experiments/cloud-credential-evidence/fixtures.py

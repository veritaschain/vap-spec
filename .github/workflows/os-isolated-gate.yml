name: Experimental OS-isolated gate

on:
  pull_request:
    paths:
      - 'experiments/os-isolated-gate/**'
      - 'experiments/pre-record-gate/**'
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/os-isolated-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/os-isolated-gate/requirements.txt
      - name: Controller and transport regressions
        working-directory: experiments/os-isolated-gate
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Execute actual Linux UID, namespace, filesystem and network probes
        working-directory: experiments/os-isolated-gate
        run: |
          python -m isolation_lab run-suite
          python -m isolation_lab verify-evidence generated/evidence.json
      - name: Preserve existing gate regressions, scenarios and evidence verification
        working-directory: experiments/pre-record-gate
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests -v
          python -m record_gate run-suite
          python -m record_gate verify-exports
      - name: Preserve existing verifier regressions and 14 acceptance cases
        working-directory: experiments/declared-scope-verifier
        run: |
          python -m unittest discover -s tests -v
          python -m scope_verifier run-suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: os-isolation-linux-python-3.12
          path: |
            experiments/os-isolated-gate/generated/
            experiments/pre-record-gate/generated/
            experiments/declared-scope-verifier/generated/
          if-no-files-found: error
          retention-days: 30

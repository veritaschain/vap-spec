name: Experimental secret-value screening
on:
  pull_request:
    paths:
      - 'experiments/secret-value-screening/**'
      - '.github/workflows/secret-value-screening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screening:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Synthetic regressions, not a scan of any real record
        working-directory: experiments/secret-value-screening
        run: |
          python -W error -m unittest discover -s tests -v
          python -O -m unittest discover -s tests -v
          python secret_screen.py run-suite
          git diff --exit-code

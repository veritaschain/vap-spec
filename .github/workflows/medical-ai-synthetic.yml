name: Medical AI synthetic evidence checks
on:
  pull_request:
    paths:
      - 'proposals/medical-ai-evidence/**'
      - '.github/workflows/medical-ai-synthetic.yml'
  push:
    branches: [main]
    paths:
      - 'proposals/medical-ai-evidence/**'
      - '.github/workflows/medical-ai-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic classification tests
        run: python -m unittest discover -s proposals/medical-ai-evidence/tests -p 'test_*.py' -v

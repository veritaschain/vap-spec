name: Controlled incident collector pilot

on:
  push:
    paths:
      - 'experiments/incident-collector-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-recheck-kit/**'
      - 'experiments/incident-review-report/**'
      - '.github/workflows/incident-collector-pilot.yml'
  pull_request:
    paths:
      - 'experiments/incident-collector-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-recheck-kit/**'
      - 'experiments/incident-review-report/**'
      - '.github/workflows/incident-collector-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/incident-collector-pilot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Unit and actual process/network tests; zero skips required
        run: python -W error::ResourceWarning run_tests.py
      - name: Execute all 18 measured collector scenarios
        run: python -m collector_pilot run-suite --output generated --print-summary
      - name: Recheck saved evidence using the trusted run's summary hash
        run: python -m collector_pilot verify-exports generated/public --expected-summary-sha256 "$(cat generated/summary.sha256)"
      - name: Confirm all 154 frozen execution inputs retain their reviewed hashes
        run: python -c "from collector_pilot import verify_frozen_sources; assert len(verify_frozen_sources()) == 154"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: incident-collector-python-${{ matrix.python }}
          path: experiments/incident-collector-pilot/generated/public/
          if-no-files-found: error
          retention-days: 30

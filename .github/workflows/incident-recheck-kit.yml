name: Incident evidence offline recheck kit

on:
  push:
    paths:
      - 'experiments/incident-recheck-kit/**'
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-publication-pilot/**'
      - 'experiments/incident-erasure-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-recheck-kit.yml'
  pull_request:
    paths:
      - 'experiments/incident-recheck-kit/**'
      - 'experiments/incident-upload-pilot/**'
      - 'experiments/incident-publication-pilot/**'
      - 'experiments/incident-erasure-pilot/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-recheck-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/incident-recheck-kit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Explicit dependency preparation before offline verification
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Strict tests, identical rebuild and 53 offline rechecks
        run: python -W error::ResourceWarning record_run.py --output generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incident-recheck-python-${{ matrix.python-version }}
          path: |
            experiments/incident-recheck-kit/generated/incident-ci-2026-10-30.zip
            experiments/incident-recheck-kit/generated/SHA256SUMS
            experiments/incident-recheck-kit/generated/summary.json
          if-no-files-found: error
          retention-days: 30

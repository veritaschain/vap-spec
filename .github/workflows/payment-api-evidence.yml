name: Payment API evidence experiment

on:
  push:
    paths:
      - 'experiments/payment-api-evidence/**'
      - 'proposals/payment-api-evidence/**'
      - '.github/workflows/payment-api-evidence.yml'
  pull_request:
    paths:
      - 'experiments/payment-api-evidence/**'
      - 'proposals/payment-api-evidence/**'
      - '.github/workflows/payment-api-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/payment-api-evidence/requirements.txt
      - run: python -m unittest discover -s experiments/payment-api-evidence/tests -v

name: Incident retention evidence adapter

on:
  push:
    paths:
      - 'experiments/incident-retention-adapter/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-retention-adapter.yml'
  pull_request:
    paths:
      - 'experiments/incident-retention-adapter/**'
      - 'experiments/incident-evidence-assessor/**'
      - '.github/workflows/incident-retention-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/incident-retention-adapter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Authentication, scope, cutoff and follow-up tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Execute synthetic retention scenarios
        run: python suite.py run --output generated
      - name: Re-evaluate captured evidence
        run: python suite.py verify generated
      - name: Preserve unchanged assessor behavior
        working-directory: experiments/incident-evidence-assessor
        run: |
          python -m unittest discover -s tests -v
          python -m incident_assessor run-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incident-retention-python-${{ matrix.python-version }}
          path: |
            experiments/incident-retention-adapter/generated/summary.json
            experiments/incident-retention-adapter/generated/cases/
          if-no-files-found: error
          retention-days: 30

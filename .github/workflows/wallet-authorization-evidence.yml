name: Wallet authorization evidence experiment

on:
  push:
    paths:
      - 'experiments/wallet-authorization-evidence/**'
      - 'proposals/wallet-authorization-evidence/**'
      - '.github/workflows/wallet-authorization-evidence.yml'
  pull_request:
    paths:
      - 'experiments/wallet-authorization-evidence/**'
      - 'proposals/wallet-authorization-evidence/**'
      - '.github/workflows/wallet-authorization-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/wallet-authorization-evidence/requirements.txt
      - run: python -m unittest discover -s experiments/wallet-authorization-evidence/tests -p 'test_wallet_evidence.py' -v
  local-evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/wallet-authorization-evidence/requirements.txt -r experiments/wallet-authorization-evidence/requirements-evm.txt
      - run: python -m unittest discover -s experiments/wallet-authorization-evidence/tests -p 'test_evm_delegation.py' -v

name: Incident evidence offline assessor

on:
  push:
    paths:
      - 'experiments/incident-evidence-assessor/**'
      - 'proposals/incident-evidence-bindings/acceptance-cases.json'
      - '.github/workflows/incident-evidence-assessor.yml'
  pull_request:
    paths:
      - 'experiments/incident-evidence-assessor/**'
      - 'proposals/incident-evidence-bindings/acceptance-cases.json'
      - '.github/workflows/incident-evidence-assessor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/incident-evidence-assessor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Cryptographic, semantic and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Derive and compare all 23 scenario outcomes
        run: python -m incident_assessor run-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: incident-evidence-python-${{ matrix.python }}
          path: experiments/incident-evidence-assessor/generated/
          if-no-files-found: error
          retention-days: 30

name: Declared scope research verifier

on:
  push:
    paths:
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/scope-verifier.yml'
  pull_request:
    paths:
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/scope-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/declared-scope-verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Cryptographic and semantic regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute 14 scenarios in both modes and compare expectations
        run: python -m scope_verifier run-suite
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-evidence-python-${{ matrix.python }}
          path: experiments/declared-scope-verifier/generated/
          if-no-files-found: error
          retention-days: 30

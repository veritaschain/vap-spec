name: Declared scope research verifier

on:
  push:
    paths:
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/scope-verifier.yml'
  pull_request:
    paths:
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/scope-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: experiments/declared-scope-verifier
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Cryptographic and semantic regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute 14 scenarios in both modes and compare expectations
        run: python -m scope_verifier run-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-evidence-python-${{ matrix.python }}
          path: experiments/declared-scope-verifier/generated/
          if-no-files-found: error
          retention-days: 30

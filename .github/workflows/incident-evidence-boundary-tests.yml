name: Incident evidence boundary experiments
on:
  pull_request:
    paths:
      - 'experiments/incident-evidence-bindings/**'
      - '.github/workflows/incident-evidence-boundary-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic negative tests
        run: python -m unittest discover -s experiments/incident-evidence-bindings -p 'test_*.py' -v

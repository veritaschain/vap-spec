name: Experimental pre-record gate

on:
  push:
    paths:
      - 'experiments/pre-record-gate/**'
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/pre-record-gate.yml'
  pull_request:
    paths:
      - 'experiments/pre-record-gate/**'
      - 'experiments/declared-scope-verifier/**'
      - '.github/workflows/pre-record-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r experiments/pre-record-gate/requirements.txt
      - name: Gate signature, binding and failure regressions
        working-directory: experiments/pre-record-gate
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Execute 15 mock gate scenarios and measure local overhead
        working-directory: experiments/pre-record-gate
        run: python -m record_gate run-suite
      - name: Recheck exported signatures and both verifier modes
        working-directory: experiments/pre-record-gate
        run: python -m record_gate verify-exports
      - name: Preserve merged verifier regressions and 14 acceptance cases
        working-directory: experiments/declared-scope-verifier
        run: |
          python -m unittest discover -s tests -v
          python -m scope_verifier run-suite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mock-gate-python-${{ matrix.python }}
          path: |
            experiments/pre-record-gate/generated/
            experiments/declared-scope-verifier/generated/
          if-no-files-found: error
          retention-days: 30

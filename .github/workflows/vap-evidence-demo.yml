name: Experimental VAP interop demo

on:
  push:
    paths:
      - 'interop/**'
      - '.github/workflows/vap-evidence-demo.yml'
  pull_request:
    paths:
      - 'interop/**'
      - '.github/workflows/vap-evidence-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/vap-evidence-pack-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install fixed verifier and schema-test dependencies
        run: python -m pip install -r requirements.txt -c release-preparation/2026-11-07/constraints.txt
      - name: Reproduce fixed dataset and both verifier CLIs
        run: sh reproduce.sh

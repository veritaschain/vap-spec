name: Experimental VAP interop demo

on:
  push:
    paths:
      - 'interop/**'
      - '.github/workflows/vap-evidence-demo.yml'
  pull_request:
    paths:
      - 'interop/**'
      - '.github/workflows/vap-evidence-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/vap-evidence-pack-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install fixed verifier and schema-test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare deterministic fixtures without writing
        run: python generate_demo.py --check
      - name: Check schemas, strict boundaries, roots and both verifier CLIs
        run: python -m unittest discover -s tests -v

name: Payment evidence collector pilot

on:
  push:
    paths:
      - 'experiments/payment-collector-pilot/**'
      - 'experiments/payment-authorization-pilot/**'
      - 'experiments/payment-runtime-pilot/**'
      - '.github/workflows/payment-collector-pilot.yml'
  pull_request:
    paths:
      - 'experiments/payment-collector-pilot/**'
      - 'experiments/payment-authorization-pilot/**'
      - 'experiments/payment-runtime-pilot/**'
      - '.github/workflows/payment-collector-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/payment-collector-pilot/requirements.txt
      - name: Collector custody, outage and native process recovery
        run: python -W error::ResourceWarning -m unittest discover -s experiments/payment-collector-pilot/tests -v
      - name: Collector behavior under optimized Python
        run: python -O -W error::ResourceWarning -m unittest discover -s experiments/payment-collector-pilot/tests -v
      - name: Recheck authorization and native runtime
        run: |
          python -W error::ResourceWarning -m unittest discover -s experiments/payment-authorization-pilot/tests -v
          python -W error::ResourceWarning -m unittest discover -s experiments/payment-runtime-pilot/tests -v
      - name: Public collector and payment recovery demo
        run: python experiments/payment-collector-pilot/run_demo.py --output experiments/payment-collector-pilot/generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payment-collector-public-demo
          path: |
            experiments/payment-collector-pilot/generated/summary.json
            experiments/payment-collector-pilot/generated/evidence-bundle.json
          if-no-files-found: error
          retention-days: 30
